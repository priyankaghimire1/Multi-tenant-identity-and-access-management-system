name: iam

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: http://localhost:8080
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  openfga-migrate:
    image: openfga/openfga:v1.8.4
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/openfga?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  openfga:
    image: openfga/openfga:v1.8.4
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/openfga?sslmode=disable
      OPENFGA_AUTHN_METHOD: preshared
      OPENFGA_AUTHN_PRESHARED_KEYS: ${OPENFGA_API_KEY}
      OPENFGA_PLAYGROUND_ENABLED: "true"
      OPENFGA_LOG_FORMAT: json
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=openfga:8081"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "8081:8080"   
      - "3000:3000"   

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      PORT: 4000
      OIDC_ISSUER: http://localhost:8080/realms/multitenant
      OIDC_JWKS_URI: http://keycloak:8080/realms/multitenant/protocol/openid-connect/certs
      FGA_API_URL: http://openfga:8080
      FGA_API_KEY: ${OPENFGA_API_KEY}
      FGA_STORE_NAME: multitenant-iam
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/app
      OIDC_AUDIENCE: gateway-api
      SEED_DEMO: "true"
    depends_on:
      openfga:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "4000:4000"

volumes:
  pgdata:
