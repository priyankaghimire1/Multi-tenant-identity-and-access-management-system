services:
  postgres:
    image: postgres:16-alpine
    container_name: iam_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dat
      POSTGRES_PASSWORD: dat
      POSTGRES_DB: dat
    ports:
      - "5432:5432"
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dat -d dat"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: iam_keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: adminpassword
      KC_HTTP_PORT: 8081
    ports:
      - "8081:8081"
    volumes:
      - ./keycloak/realm/multitenant-realm.json:/opt/keycloak/data/import/multitenant-realm.json:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /realms/dat HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q '200'",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy

  openfga:
    image: openfga/openfga:latest
    container_name: iam_openfga
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: memory
      OPENFGA_PLAYGROUND_ENABLED: "true"
      OPENFGA_LOG_FORMAT: json
    ports:
      - "8080:8080"
      - "3001:3000"
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=localhost:8081"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  openfga-init:
    image: alpine:3.20
    container_name: iam_openfga_init
    volumes:
      - ./openfga/model.json:/model.json:ro
      - fga_ids:/seed
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache curl jq >/dev/null
        echo "Waiting for OpenFGA..."
        until curl -sf http://openfga:8080/healthz >/dev/null; do sleep 1; done
        
        echo "Creating store..."
        STORE_ID=$$(curl -s -X POST http://openfga:8080/stores -H 'content-type: application/json' -d '{"name":"multitenant-iam"}' | jq -r .id)
        if [ -z "$$STORE_ID" ] || [ "$$STORE_ID" = "null" ]; then
          echo "Failed to create store"
          exit 1
        fi
        
        echo "Uploading model..."
        MODEL_ID=$$(curl -s -X POST http://openfga:8080/stores/$$STORE_ID/authorization-models -H 'content-type: application/json' --data @/model.json | jq -r .authorization_model_id)
        if [ -z "$$MODEL_ID" ] || [ "$$MODEL_ID" = "null" ]; then
          echo "Failed to upload model"
          exit 1
        fi
        
        echo "$$STORE_ID" > /seed/store_id
        echo "$$MODEL_ID" > /seed/model_id
        echo "FGA_STORE_ID=$$STORE_ID"
        echo "FGA_MODEL_ID=$$MODEL_ID"
    depends_on:
      openfga:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: iam_seed
    environment:
      DATABASE_URL: postgres://dat:dat@postgres:5432/dat
      FGA_API_URL: http://openfga:8080
      SUPER_ADMIN_SUB: super-admin-000
    volumes:
      - fga_ids:/seed:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until [ -s /seed/store_id ] && [ -s /seed/model_id ]; do sleep 1; done
        export FGA_STORE_ID=$$(cat /seed/store_id)
        export FGA_MODEL_ID=$$(cat /seed/model_id)
        exec node scripts/seed.js
    depends_on:
      postgres:
        condition: service_healthy
      openfga:
        condition: service_healthy
      openfga-init:
        condition: service_completed_successfully
    restart: "no"

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: iam_gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://dat:dat@postgres:5432/dat
      KEYCLOAK_URL: http://keycloak:8081
      KEYCLOAK_REALM: dat
      FGA_API_URL: http://openfga:8080
    volumes:
      - fga_ids:/seed:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until [ -s /seed/store_id ] && [ -s /seed/model_id ]; do sleep 1; done
        export FGA_STORE_ID=$$(cat /seed/store_id)
        export FGA_MODEL_ID=$$(cat /seed/model_id)
        echo "gateway: store=$$FGA_STORE_ID model=$$FGA_MODEL_ID"
        exec node src/index.js
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      openfga:
        condition: service_healthy
      openfga-init:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully

volumes:
  pgdata:
  fga_ids: