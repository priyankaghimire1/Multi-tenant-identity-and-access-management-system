version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: iam_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: iam_keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: adminpassword
      KC_HTTP_PORT: 8081
    ports:
      - "8081:8081"
    volumes:
      - ./keycloak/realm/multitenant-realm.json:/opt/keycloak/data/import/multitenant-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  openfga:
    image: openfga/openfga:latest
    container_name: iam_openfga
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: memory
      OPENFGA_PLAYGROUND_ENABLED: "true"
    ports:
      - "8080:8080"
      - "3001:3000"
    healthcheck:
      test: ["CMD", "/usr/local/bin/openfga", "healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

  openfga-init:
    image: openfga/cli:latest
    container_name: iam_openfga_init
    volumes:
      - ./openfga/model.fga:/model.fga:ro
    environment:
      FGA_API_URL: http://openfga:8080
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for OpenFGA server to be healthy..."
        sleep 3
        echo "Creating default multi-tenant OpenFGA store..."
        STORE_OUTPUT=$$(fga store create --name "multitenant-iam")
        echo "$$STORE_OUTPUT"
        STORE_ID=$$(echo "$$STORE_OUTPUT" | grep -o '01[A-Z0-9]*' | head -n 1)
        if [ -n "$$STORE_ID" ]; then
          echo "Writing authorization model from /model.fga into store $$STORE_ID..."
          fga model write --store-id "$$STORE_ID" --file /model.fga
        fi
    depends_on:
      openfga:
        condition: service_healthy

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: iam_gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/app_db
      KEYCLOAK_URL: http://keycloak:8081
      KEYCLOAK_REALM: dat
      FGA_API_URL: http://openfga:8080
      FGA_STORE_ID: ${FGA_STORE_ID:-}
      FGA_MODEL_ID: ${FGA_MODEL_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      openfga:
        condition: service_healthy

volumes:
  pgdata: