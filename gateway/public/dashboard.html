<!-- gateway/public/dashboard.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IAM Multi-Tenant Portal</title>
<style>
  :root {
    --bg:#0b1020; --bg2:#0f172a; --panel:#131c31; --panel2:#18233d; --border:#243049; --border2:#2f3d5c;
    --text:#e8edf7; --muted:#8b9ab5; --primary:#5eb5ff; --primary-d:#3b95e6; --accent:#a78bfa;
    --danger:#f4646e; --success:#34d399; --warn:#fbbf24; --radius:12px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:radial-gradient(1200px 600px at 80% -10%, #1a2750 0%, transparent 60%), var(--bg); color:var(--text); min-height:100vh; display:flex; font-size:14px; line-height:1.45; }
  #app { display:flex; width:100%; min-height:100vh; }
  ::-webkit-scrollbar { width:8px; height:8px } ::-webkit-scrollbar-thumb { background:var(--border2); border-radius:8px }

  /* Sidebar */
  .sidebar { width:252px; flex-shrink:0; background:rgba(15,23,42,.85); backdrop-filter:blur(8px); border-right:1px solid var(--border); display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
  .brand { display:flex; align-items:center; gap:.65rem; padding:1.25rem 1.25rem 1rem; font-weight:700; font-size:1.05rem; letter-spacing:.2px; }
  .logo { width:30px; height:30px; border-radius:9px; background:linear-gradient(135deg,var(--primary),var(--accent)); display:grid; place-items:center; color:#0b1020; font-weight:800; }
  .org-selector { padding:.25rem 1rem 1rem; }
  .label { font-size:.68rem; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); font-weight:600; margin-bottom:.4rem; display:block; }
  .nav { flex:1; padding:.25rem .75rem; overflow-y:auto; }
  .nav-section { margin:.9rem .5rem .35rem; font-size:.68rem; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); font-weight:600; }
  .nav-btn { display:flex; align-items:center; gap:.7rem; width:100%; text-align:left; padding:.6rem .75rem; background:none; border:none; border-radius:9px; color:var(--muted); font-size:.9rem; cursor:pointer; transition:.15s; margin-bottom:2px; }
  .nav-btn svg { width:17px; height:17px; flex-shrink:0; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .nav-btn:hover { background:#ffffff0a; color:var(--text); }
  .nav-btn.active { background:linear-gradient(90deg,#5eb5ff22,#5eb5ff08); color:var(--primary); font-weight:600; box-shadow:inset 2px 0 0 var(--primary); }
  .user-profile { padding:1rem; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:.7rem; }
  .user-row { display:flex; align-items:center; gap:.65rem; min-width:0; }
  .avatar { width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--primary)); color:#0b1020; font-weight:700; display:grid; place-items:center; flex-shrink:0; }
  .user-email { font-size:.8rem; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .user-role { font-size:.7rem; color:var(--muted); }

  /* Main */
  .main { flex:1; min-width:0; padding:2rem 2.25rem 3rem; max-width:1400px; margin:0 auto; }
  .page-head { display:flex; justify-content:space-between; align-items:flex-end; gap:1rem; margin-bottom:1.5rem; flex-wrap:wrap; }
  h1 { font-size:1.65rem; font-weight:700; letter-spacing:-.01em; }
  .sub { color:var(--muted); margin-top:.25rem; }
  h2 { font-size:1.05rem; font-weight:600; margin-bottom:1rem; }
  h3 { font-size:.9rem; font-weight:600; }

  .card { background:linear-gradient(180deg,var(--panel),#101a2e); border:1px solid var(--border); border-radius:var(--radius); padding:1.35rem; margin-bottom:1.25rem; }
  .grid-2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:1.25rem; }
  .grid-3 { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:1.25rem; }
  .stat { display:flex; flex-direction:column; gap:.3rem; }
  .stat .n { font-size:2.4rem; font-weight:700; background:linear-gradient(135deg,var(--primary),var(--accent)); -webkit-background-clip:text; background-clip:text; color:transparent; }

  /* Controls */
  button { font:inherit; cursor:pointer; border-radius:8px; transition:.15s; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .btn-primary { background:linear-gradient(135deg,var(--primary),var(--primary-d)); color:#04101f; font-weight:600; border:none; padding:.55rem 1.1rem; }
  .btn-primary:hover:not(:disabled) { filter:brightness(1.1); transform:translateY(-1px); }
  .btn-secondary { background:var(--panel2); color:var(--text); border:1px solid var(--border2); padding:.5rem .95rem; }
  .btn-secondary:hover:not(:disabled) { border-color:var(--primary); }
  .btn-danger { background:#f4646e1f; color:#ff8f97; border:1px solid #f4646e55; padding:.5rem .95rem; }
  .btn-danger:hover:not(:disabled) { background:var(--danger); color:#fff; }
  .btn-sm { padding:.3rem .65rem; font-size:.8rem; }
  input, select, textarea { width:100%; padding:.6rem .75rem; background:var(--bg2); border:1px solid var(--border); color:var(--text); border-radius:8px; font:inherit; outline:none; transition:.15s; }
  input:focus, select:focus, textarea:focus { border-color:var(--primary); box-shadow:0 0 0 3px #5eb5ff22; }
  textarea { font-family:var(--mono); font-size:.82rem; resize:vertical; min-height:110px; }
  .form-row { display:flex; gap:.75rem; margin-bottom:.9rem; flex-wrap:wrap; }
  .form-row > * { flex:1; min-width:150px; }
  .field { display:flex; flex-direction:column; }

  table { width:100%; border-collapse:collapse; font-size:.86rem; }
  th, td { padding:.8rem .9rem; text-align:left; border-bottom:1px solid var(--border); vertical-align:middle; }
  th { color:var(--muted); font-weight:600; font-size:.72rem; text-transform:uppercase; letter-spacing:.07em; }
  tbody tr:hover { background:#ffffff05; }
  .table-wrap { overflow-x:auto; }
  .mono { font-family:var(--mono); font-size:.78rem; }
  .muted { color:var(--muted); }

  .badge { display:inline-block; padding:.2rem .55rem; border-radius:999px; font-size:.7rem; font-weight:600; }
  .badge-success { background:#34d39922; color:#4ee0ae; } .badge-danger { background:#f4646e22; color:#ff8f97; }
  .badge-info { background:#5eb5ff22; color:var(--primary); } .badge-warn { background:#fbbf2422; color:var(--warn); } .badge-purple { background:#a78bfa22; color:#c4b0ff; }

  .course-card { display:flex; flex-direction:column; justify-content:space-between; margin:0; transition:.2s; }
  .course-card:hover { border-color:var(--border2); transform:translateY(-2px); }
  .course-title { font-size:1.05rem; font-weight:600; margin-bottom:.3rem; }
  .perm-row { display:flex; gap:.4rem; margin-top:.9rem; flex-wrap:wrap; }
  .perm { padding:.15rem .5rem; border-radius:6px; font-size:.72rem; font-weight:600; }
  .perm.yes { background:#34d39920; color:#4ee0ae } .perm.no { background:#f4646e18; color:#ff8f97; text-decoration:line-through; opacity:.8 }

  .toast-wrap { position:fixed; bottom:1.5rem; right:1.5rem; display:flex; flex-direction:column; gap:.5rem; z-index:3000; }
  .toast { padding:.8rem 1.1rem; border-radius:10px; background:var(--panel2); border:1px solid var(--border2); border-left:4px solid var(--primary); box-shadow:0 8px 24px #0008; animation:slide .25s ease; max-width:360px; }
  .toast.error { border-left-color:var(--danger) } .toast.success { border-left-color:var(--success) }
  @keyframes slide { from { transform:translateX(30px); opacity:0 } to { transform:none; opacity:1 } }

  .banner { padding:.8rem 1rem; border-radius:10px; background:#fbbf2414; border:1px solid #fbbf2440; color:#fcd36b; margin-bottom:1.25rem; font-size:.85rem; }
  .info-box { padding:.8rem 1rem; border-radius:10px; background:#5eb5ff12; border:1px solid #5eb5ff33; color:#b8dcff; font-size:.84rem; }

  /* Console */
  .console { display:grid; grid-template-columns:330px 1fr; gap:1.25rem; align-items:start; }
  @media (max-width:1000px) { .console { grid-template-columns:1fr } }
  .ep-list { max-height:72vh; overflow-y:auto; padding:.5rem; }
  .ep-group { font-size:.68rem; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); padding:.7rem .6rem .3rem; font-weight:600; }
  .ep { display:flex; align-items:center; gap:.6rem; width:100%; text-align:left; background:none; border:1px solid transparent; color:var(--text); padding:.5rem .6rem; border-radius:8px; }
  .ep:hover { background:#ffffff08 } .ep.active { background:#5eb5ff14; border-color:#5eb5ff44; }
  .ep .path { font-family:var(--mono); font-size:.74rem; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .method { font-family:var(--mono); font-size:.64rem; font-weight:700; padding:.15rem .4rem; border-radius:5px; min-width:46px; text-align:center; }
  .m-GET { background:#34d39922; color:#4ee0ae } .m-POST { background:#5eb5ff22; color:var(--primary) } .m-PATCH { background:#fbbf2422; color:var(--warn) } .m-DELETE { background:#f4646e22; color:#ff8f97 }
  .resp { background:#070b16; border:1px solid var(--border); border-radius:10px; padding:1rem; font-family:var(--mono); font-size:.78rem; max-height:420px; overflow:auto; white-space:pre-wrap; word-break:break-word; }
  .status-pill { font-family:var(--mono); font-size:.78rem; font-weight:700; padding:.2rem .6rem; border-radius:6px; }
  .st-ok { background:#34d39922; color:#4ee0ae } .st-err { background:#f4646e22; color:#ff8f97 }

  /* Agents */
  .scope-opt { display:flex; align-items:flex-start; gap:.65rem; padding:.7rem .85rem; border:1px solid var(--border); border-radius:10px; cursor:pointer; background:var(--bg2); }
  .scope-opt:hover { border-color:var(--border2) } .scope-opt input { width:auto; margin-top:.2rem; }
  .scope-opt.on { border-color:var(--primary); background:#5eb5ff10 }
  .chips { display:flex; gap:.5rem; flex-wrap:wrap; }
  .chip { padding:.4rem .85rem; border-radius:999px; border:1px solid var(--border2); background:var(--bg2); color:var(--muted); cursor:pointer; font-size:.82rem; }
  .chip.on { background:var(--primary); color:#04101f; border-color:var(--primary); font-weight:600; }
  .token-box { background:#070b16; border:1px dashed var(--border2); border-radius:10px; padding:.85rem; font-family:var(--mono); font-size:.72rem; word-break:break-all; color:#b8dcff; max-height:120px; overflow:auto; }
  .countdown { font-family:var(--mono); font-weight:700; }

  .drawer-bg { position:fixed; inset:0; background:rgba(3,6,14,.75); backdrop-filter:blur(3px); z-index:2000; display:flex; justify-content:flex-end; }
  .drawer { width:480px; max-width:100%; background:var(--panel); height:100%; padding:1.75rem; overflow-y:auto; border-left:1px solid var(--border2); animation:slide .2s ease; }
  .step { padding:.85rem 1rem; border-left:4px solid; background:var(--bg2); margin-bottom:.7rem; border-radius:0 10px 10px 0; }
  .step.ok { border-color:var(--success) } .step.bad { border-color:var(--danger) }
  .empty { text-align:center; padding:3rem 1rem; color:var(--muted); }
  .center-screen { display:flex; min-height:100vh; width:100%; align-items:center; justify-content:center; padding:1rem; }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast-wrap" id="toasts"></div>

<script>
const CONFIG = { keycloakUrl:'http://localhost:8081', realm:'dat', clientId:'web-app', redirectUri: window.location.origin + '/dashboard.html' };

/* ---------- helpers ---------- */
function el(tag, props = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.substring(2).toLowerCase(), v);
    else if (k === 'className') e.className = v;
    else if (k === 'value' || k === 'checked' || k === 'selected' || k === 'disabled') e[k] = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  const add = (c) => {
    if (Array.isArray(c)) c.forEach(add);
    else if (typeof c === 'string' || typeof c === 'number') e.appendChild(document.createTextNode(String(c)));
    else if (c instanceof Node) e.appendChild(c);
  };
  children.forEach(add);
  return e;
}
function toast(msg, type = 'info') {
  const t = el('div', { className: `toast ${type}` }, msg);
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => t.remove(), 3500);
}
const showToast = (m) => toast(m, 'success');
async function errMsg(res) { try { return (await res.json()).error || res.statusText; } catch { return res.statusText; } }
function copy(text) { navigator.clipboard.writeText(text).then(() => toast('Copied to clipboard', 'success'), () => toast('Copy failed', 'error')); }
const fmtDate = (d) => d ? new Date(d).toLocaleString() : '—';
const icons = {
  grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-3.5 3-5.5 6.5-5.5s6 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c2 .6 3.2 2.4 3.5 5.2"/>',
  book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/>',
  log:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/>',
  bot:'<rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 8V4M9 13v1M15 13v1M2 13v3M22 13v3"/>',
  term:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 10 3 2.5L7 15M13 15h4"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c.7-4 3.7-6 8-6s7.3 2 8 6"/>'
};
const icon = (n) => { const s = document.createElementNS('http://www.w3.org/2000/svg','svg'); s.setAttribute('viewBox','0 0 24 24'); s.innerHTML = icons[n] || ''; return s; };

/* ---------- auth (PKCE) ---------- */
function generateRandomString(len) { const a = new Uint8Array(len); crypto.getRandomValues(a); return Array.from(a, d => ('0' + d.toString(16)).slice(-2)).join(''); }
async function generateCodeChallenge(v) {
  const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v));
  return btoa(String.fromCharCode(...new Uint8Array(digest))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function startLogin(idpHint) {
  const st = generateRandomString(16), verifier = generateRandomString(32);
  sessionStorage.setItem('pkce_state', st); sessionStorage.setItem('pkce_verifier', verifier);
  generateCodeChallenge(verifier).then(challenge => {
    const p = { client_id:CONFIG.clientId, response_type:'code', scope:'openid email profile', redirect_uri:CONFIG.redirectUri, state:st, code_challenge:challenge, code_challenge_method:'S256' };
    if (idpHint) p.kc_idp_hint = idpHint;
    window.location.href = `${CONFIG.keycloakUrl}/realms/${CONFIG.realm}/protocol/openid-connect/auth?` + new URLSearchParams(p);
  });
}
const startFederatedLogin = () => startLogin('acme-okta');
async function handleAuthCallback() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code'), st = params.get('state');
  if (!code || st !== sessionStorage.getItem('pkce_state')) return false;
  window.history.replaceState({}, document.title, window.location.pathname);
  const res = await fetch(`${CONFIG.keycloakUrl}/realms/${CONFIG.realm}/protocol/openid-connect/token`, {
    method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:new URLSearchParams({ client_id:CONFIG.clientId, grant_type:'authorization_code', code, redirect_uri:CONFIG.redirectUri, code_verifier:sessionStorage.getItem('pkce_verifier') }).toString()
  });
  if (!res.ok) throw new Error('Token exchange failed');
  const t = await res.json();
  sessionStorage.setItem('access_token', t.access_token); sessionStorage.setItem('refresh_token', t.refresh_token); sessionStorage.setItem('id_token', t.id_token);
  return true;
}
async function refreshAccessToken() {
  const rt = sessionStorage.getItem('refresh_token'); if (!rt) return null;
  const res = await fetch(`${CONFIG.keycloakUrl}/realms/${CONFIG.realm}/protocol/openid-connect/token`, {
    method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:new URLSearchParams({ client_id:CONFIG.clientId, grant_type:'refresh_token', refresh_token:rt }).toString()
  });
  if (!res.ok) return null;
  const t = await res.json(); sessionStorage.setItem('access_token', t.access_token); return t.access_token;
}
async function apiFetch(url, options = {}, retried = false) {
  const token = sessionStorage.getItem('access_token');

  if (!token) {
    throw new Error('No authentication token');
  }

  options.headers = {
    ...options.headers,
    Authorization: `Bearer ${token}`
  };

  const res = await fetch(url, options);

  if (res.status === 401 && !retried) {
    if (await refreshAccessToken()) {
      return apiFetch(url, options, true);
    }

    // Refresh failed: return the user to your login page.
    sessionStorage.removeItem('access_token');
    sessionStorage.removeItem('refresh_token');
    sessionStorage.removeItem('id_token');

    state.user = null;
    renderAuth();

    throw new Error('Session expired');
  }

  return res;
}

/* ---------- state ---------- */
const state = { user:null, orgs:[], selectedOrgId:null, orgData:null, platformOrgs:null, unassignedUsers:null, auditLogs:null, auditFilter:'', view:'dashboard', consoleSel:0, consoleParams:{}, consoleBody:null, consoleResp:null, delegations:[], lastToken:null };
const loadDelegations = () => { try { state.delegations = JSON.parse(sessionStorage.getItem('delegations') || '[]'); } catch { state.delegations = []; } };
const saveDelegations = () => sessionStorage.setItem('delegations', JSON.stringify(state.delegations));
const isSuper = () => !!state.user?.is_super_admin;
const isOrgAdmin = () => state.orgData?.me?.role === 'admin';
const canConsole = () => isSuper() || isOrgAdmin();

/* ---------- API console catalogue ---------- */
const ENDPOINTS = [
  { g:'Identity', m:'GET', p:'/api/me', who:'any' },
  { g:'Identity', m:'GET', p:'/api/orgs/{org_id}/overview', who:'any' },
  { g:'Identity', m:'POST', p:'/api/auth/revoke-session', who:'any', danger:'This invalidates YOUR current session and signs you out.' },
  { g:'Platform', m:'GET', p:'/api/admin/orgs', who:'super' },
  { g:'Platform', m:'GET', p:'/api/admin/unassigned-users', who:'super' },
  { g:'Platform', m:'POST', p:'/api/orgs', who:'super', body:{ org_id:'organization:acme', name:'Acme Inc', domain:'acme.com', admin_email:'admin@acme.com' } },
  { g:'Platform', m:'PATCH', p:'/api/orgs/{org_id}/suspend', who:'super' },
  { g:'Platform', m:'PATCH', p:'/api/orgs/{org_id}/unsuspend', who:'super' },
  { g:'Members', m:'POST', p:'/api/orgs/{org_id}/memberships', who:'admin', body:{ email:'user@example.com', role:'learner' } },
  { g:'Members', m:'PATCH', p:'/api/orgs/{org_id}/members/{user_sub}/role', who:'admin', body:{ role:'instructor' } },
  { g:'Members', m:'PATCH', p:'/api/orgs/{org_id}/members/{user_sub}/suspend', who:'admin' },
  { g:'Members', m:'PATCH', p:'/api/orgs/{org_id}/members/{user_sub}/unsuspend', who:'admin' },
  { g:'Members', m:'DELETE', p:'/api/orgs/{org_id}/members/{user_sub}', who:'admin', danger:'Permanently removes the member from the organization.' },
  { g:'Courses', m:'POST', p:'/api/courses', who:'admin', body:{ course_id:'course:cs101', org_id:'{org}', title:'Intro to CS', description:'' } },
  { g:'Courses', m:'GET', p:'/api/courses/{course_id}', who:'any' },
  { g:'Courses', m:'GET', p:'/api/orgs/{org_id}/courses/{course_id}/trace', who:'any' },
  { g:'Agents', m:'POST', p:'/api/agents/delegate', who:'any', body:{ agent_id:'my-agent', org_id:'{org}', scopes:['course:read'], duration_minutes:30 } },
  { g:'Audit', m:'GET', p:'/api/orgs/{org_id}/audit-logs?limit=50', who:'admin' },
  { g:'Audit', m:'GET', p:'/api/orgs/{org_id}/audit-logs?format=csv&limit=200', who:'admin' }
];
const visibleEndpoints = () => ENDPOINTS.filter(e => e.who === 'any' || (e.who === 'admin' && canConsole()) || (e.who === 'super' && isSuper()));
const pathParams = (p) => [...p.matchAll(/\{(\w+)\}/g)].map(m => m[1]).filter(k => k !== 'org');

/* ---------- init ---------- */
async function init() {
  loadDelegations();

  // Handle Keycloak's authorization callback.
  if (window.location.search.includes('code=')) {
    try {
      await handleAuthCallback();
    } catch (e) {
      toast(e.message, 'error');
    }
  }

  // Check for an existing session.
  let token = sessionStorage.getItem('access_token');

  // Try refreshing if only the refresh token is available.
  if (!token && sessionStorage.getItem('refresh_token')) {
    token = await refreshAccessToken();
  }

  // No valid session: show our custom login page.
  if (!token) {
    renderAuth();
    return;
  }

  try {
    const res = await apiFetch('/api/me');

    if (!res.ok) {
      throw new Error('Failed to retrieve user information');
    }

    const data = await res.json();

    state.user = data.user;
    state.orgs = data.orgs || [];

    if (state.orgs.length > 0) {
      state.selectedOrgId = state.orgs[0].org_id;
    }

    if (isSuper()) {
      state.view = 'platform';
      await loadPlatformOrgs(false);

      if (state.selectedOrgId) {
        loadOrg();
      } else {
        render();
      }
    } else if (state.selectedOrgId) {
      state.view = 'dashboard';
      await loadOrg();
    } else {
      render();
    }

  } catch (e) {
    console.error('Initialization error:', e);
    renderAuth();
  }

        const d = await res.json();
        const rec = { agent_id:form.agent.trim(), org_id:form.org, scopes:[...form.scopes], expires_at:d.expires_at, token:d.token, created_at:new Date().toISOString() };
        state.delegations.unshift(rec); saveDelegations(); state.lastToken = rec; showToast('Access granted'); render();
      } },
        el('div', { className:'field', style:'margin-bottom:1rem' }, el('span', { className:'label' }, 'AI model / agent ID'), el('input', { placeholder:'e.g. claude-study-helper', value:form.agent, onInput:(e) => form.agent = e.target.value })),
        el('div', { className:'field', style:'margin-bottom:1rem' }, el('span', { className:'label' }, 'Organization'),
          el('select', { onChange:(e) => form.org = e.target.value }, ...state.orgs.map(o => el('option', { value:o.org_id, selected:o.org_id === form.org }, o.name)))),
        el('div', { className:'field', style:'margin-bottom:1rem' }, el('span', { className:'label' }, 'Permissions'), el('div', { style:'display:flex;flex-direction:column;gap:.5rem' }, ...scopeBoxes)),
        el('div', { className:'field', style:'margin-bottom:1.25rem' }, el('span', { className:'label' }, 'Valid for'), chipWrap),
        el('button', { className:'btn-primary', type:'submit', style:'width:100%;padding:.7rem' }, 'Grant access'))),
    el('div', {},
      el('div', { className:'info-box', style:'margin-bottom:1rem' }, 'The AI acts as you: every request is still checked against your own permissions, and stops working automatically when the time runs out.'),
      state.lastToken ? tokenCard(state.lastToken) : el('div', { className:'card empty', style:'margin:0' }, 'Your new access token will appear here.'))));

  c.appendChild(el('div', { className:'card', style:'margin-top:1.25rem' }, el('h2', {}, 'Your grants (this session)'),
    state.delegations.length === 0 ? el('div', { className:'empty' }, 'No grants yet.') :
    el('div', { className:'table-wrap' }, el('table', {},
      el('thead', {}, el('tr', {}, ...['Agent','Organization','Scopes','Time left',''].map(h => el('th', {}, h)))),
      el('tbody', {}, ...state.delegations.map((d, i) => el('tr', {},
        el('td', {}, d.agent_id), el('td', { className:'mono' }, d.org_id),
        el('td', {}, ...d.scopes.map(s => el('span', { className:'badge badge-purple', style:'margin-right:.3rem' }, s))),
        el('td', {}, el('span', { className:'countdown', 'data-exp':d.expires_at }, fmtRemaining(new Date(d.expires_at) - Date.now()))),
        el('td', {}, el('div', { style:'display:flex;gap:.4rem' },
          el('button', { className:'btn-secondary btn-sm', onClick:() => { state.lastToken = d; render(); } }, 'View'),
          el('button', { className:'btn-danger btn-sm', onClick:() => { state.delegations.splice(i, 1); saveDelegations(); if (state.lastToken === d) state.lastToken = null; render(); toast('Removed from this list. The token itself stays valid until it expires.'); } }, 'Forget'))))))),
    ),
    el('p', { className:'muted', style:'margin-top:.8rem;font-size:.78rem' }, 'The gateway has no list or revoke endpoint for delegations yet, so this list lives in your browser session and "Forget" does not invalidate a token.')));
  startTicker();
  return c;
}

function tokenCard(d) {
  const resultBox = el('div');
  const courseInput = el('input', { placeholder:'course:cs101', style:'flex:1' });
  const curl = `curl -H "Authorization: Bearer ${d.token}" ${location.origin}/api/courses/course%3Acs101`;
  return el('div', { className:'card', style:'margin:0' },
    el('div', { style:'display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem' }, el('h2', { style:'margin:0' }, d.agent_id),
      el('span', { className:'countdown', 'data-exp':d.expires_at }, fmtRemaining(new Date(d.expires_at) - Date.now()))),
    el('div', { className:'muted', style:'margin-bottom:.8rem;font-size:.8rem' }, `Expires ${fmtDate(d.expires_at)} · ${d.org_id}`),
    el('span', { className:'label' }, 'Access token — give this to the AI'),
    el('div', { className:'token-box' }, d.token),
    el('div', { style:'display:flex;gap:.5rem;margin:.7rem 0 1rem;flex-wrap:wrap' },
      el('button', { className:'btn-secondary btn-sm', onClick:() => copy(d.token) }, 'Copy token'),
      el('button', { className:'btn-secondary btn-sm', onClick:() => copy(curl) }, 'Copy curl example')),
    el('span', { className:'label' }, 'Test this token'),
    el('div', { style:'display:flex;gap:.5rem' }, courseInput,
      el('button', { className:'btn-primary btn-sm', onClick: async () => {
        const id = courseInput.value.trim(); if (!id) return;
        resultBox.innerHTML = '';
        try {
          const r = await fetch(`/api/courses/${encodeURIComponent(id)}`, { headers:{ Authorization:`Bearer ${d.token}` } });
          const txt = await r.text(); let pretty = txt; try { pretty = JSON.stringify(JSON.parse(txt), null, 2); } catch {}
          resultBox.appendChild(el('div', { style:'margin-top:.7rem' }, el('span', { className:`status-pill ${r.ok ? 'st-ok' : 'st-err'}` }, `${r.status} ${r.statusText}`), el('div', { className:'resp', style:'margin-top:.5rem;max-height:200px' }, pretty)));
        } catch (e) { resultBox.appendChild(el('div', { className:'resp' }, e.message)); }
      } }, 'Send')),
    resultBox);
}

/* ---------- API console ---------- */
function renderConsole() {
  const eps = visibleEndpoints();
  if (state.consoleSel >= eps.length) state.consoleSel = 0;
  const wrap = el('div');
  wrap.appendChild(pageHead('API console', isSuper() ? 'Super admin: every gateway endpoint, called with your session token.' : 'Org admin: organization-level endpoints, called with your session token.'));
  const listBox = el('div', { className:'card ep-list', style:'margin:0;padding:.5rem' });
  const detail = el('div');
  const flex = el('div', { className:'console' }, listBox, detail);
  wrap.appendChild(flex);

  function paintList() {
    listBox.innerHTML = ''; let last = '';
    eps.forEach((e, i) => {
      if (e.g !== last) { listBox.appendChild(el('div', { className:'ep-group' }, e.g)); last = e.g; }
      listBox.appendChild(el('button', { className:`ep ${i === state.consoleSel ? 'active' : ''}`, onClick:() => { state.consoleSel = i; state.consoleBody = null; state.consoleResp = null; paintList(); paintDetail(); } },
        el('span', { className:`method m-${e.m}` }, e.m), el('span', { className:'path' }, e.p.replace('/api', ''))));
    });
  }
  function paintDetail() {
    detail.innerHTML = ''; const e = eps[state.consoleSel]; const pp = pathParams(e.p);
    const inputs = {}; const hasBody = e.body !== undefined || ['POST','PATCH'].includes(e.m);
    const defaultBody = e.body ? JSON.stringify(e.body, null, 2).replace(/"\{org\}"/g, JSON.stringify(state.selectedOrgId || '')) : '{}';
    if (state.consoleBody === null) state.consoleBody = defaultBody;
    const bodyArea = hasBody ? el('textarea', { spellcheck:'false', onInput:(ev) => state.consoleBody = ev.target.value }) : null;
    if (bodyArea) bodyArea.value = state.consoleBody;
    const respBox = el('div');
    const paintResp = () => {
      respBox.innerHTML = ''; const r = state.consoleResp; if (!r) return;
      respBox.appendChild(el('div', { style:'display:flex;gap:.7rem;align-items:center;margin:1rem 0 .5rem' }, el('span', { className:`status-pill ${r.ok ? 'st-ok' : 'st-err'}` }, `${r.status} ${r.statusText}`), el('span', { className:'muted' }, `${r.ms} ms`),
        el('button', { className:'btn-secondary btn-sm', style:'margin-left:auto', onClick:() => copy(r.text) }, 'Copy')));
      respBox.appendChild(el('div', { className:'resp' }, r.text));
    };
    const urlPreview = el('div', { className:'mono muted', style:'margin:.6rem 0 1rem;word-break:break-all' });
    const buildUrl = () => {
      let u = e.p.replace('{org_id}', encodeURIComponent(state.selectedOrgId || ''));
      pp.forEach(k => { u = u.replace(`{${k}}`, encodeURIComponent(state.consoleParams[k] || '')); });
      return u;
    };
    const refreshUrl = () => urlPreview.textContent = buildUrl();
    pp.filter(k => k !== 'org_id').forEach(k => {
      inputs[k] = el('input', { placeholder:k === 'user_sub' ? 'Keycloak user sub (UUID)' : k === 'course_id' ? 'course:cs101' : k, value:state.consoleParams[k] || '', onInput:(ev) => { state.consoleParams[k] = ev.target.value; refreshUrl(); } });
    });
    const send = async () => {
      const missing = pp.filter(k => k !== 'org_id' && !state.consoleParams[k]);
      if (missing.length) return toast(`Fill in: ${missing.join(', ')}`, 'error');
      if (e.danger && !confirm(e.danger + '\n\nContinue?')) return;
      const opts = { method:e.m, headers:{} };
      if (hasBody) { try { JSON.parse(state.consoleBody); } catch { return toast('Body is not valid JSON', 'error'); } opts.headers['Content-Type'] = 'application/json'; opts.body = state.consoleBody; }
      const t0 = performance.now(); sendBtn.disabled = true; sendBtn.textContent = 'Sending…';
      try {
        const res = await apiFetch(buildUrl(), opts); const txt = await res.text(); let pretty = txt;
        try { pretty = JSON.stringify(JSON.parse(txt), null, 2); } catch {}
        state.consoleResp = { ok:res.ok, status:res.status, statusText:res.statusText, text:pretty || '(empty)', ms:Math.round(performance.now() - t0) };
        if (res.ok && e.m !== 'GET') { loadOrg().catch(() => {}); if (isSuper()) loadPlatformOrgs(false).catch(() => {}); }
      } catch (err) { state.consoleResp = { ok:false, status:0, statusText:'Network error', text:err.message, ms:Math.round(performance.now() - t0) }; }
      sendBtn.disabled = false; sendBtn.textContent = 'Send request'; paintResp();
    };
    const sendBtn = el('button', { className:'btn-primary', onClick:send }, 'Send request');
    detail.appendChild(el('div', { className:'card', style:'margin:0' },
      el('div', { style:'display:flex;align-items:center;gap:.7rem' }, el('span', { className:`method m-${e.m}`, style:'font-size:.8rem;padding:.3rem .6rem' }, e.m), el('span', { className:'mono' }, e.p),
        el('span', { className:`badge ${e.who === 'super' ? 'badge-purple' : e.who === 'admin' ? 'badge-warn' : 'badge-info'}`, style:'margin-left:auto' }, e.who === 'super' ? 'Super admin' : e.who === 'admin' ? 'Org admin' : 'Any user')),
      urlPreview,
      e.danger ? el('div', { className:'banner' }, e.danger) : null,
      pp.filter(k => k !== 'org_id').length ? el('div', { style:'margin-bottom:1rem;display:flex;flex-direction:column;gap:.7rem' }, ...pp.filter(k => k !== 'org_id').map(k => el('div', { className:'field' }, el('span', { className:'label' }, k), inputs[k]))) : null,
      pp.includes('org_id') ? el('div', { className:'muted', style:'margin-bottom:1rem;font-size:.8rem' }, `org_id is taken from the sidebar selection (${state.selectedOrgId || 'none'}).`) : null,
      hasBody ? el('div', { className:'field', style:'margin-bottom:1rem' }, el('span', { className:'label' }, 'JSON body'), bodyArea) : null,
      sendBtn, respBox));
    refreshUrl(); paintResp();
  }
  paintList(); paintDetail();
  return wrap;
}

/* ---------- trace drawer ---------- */
async function showTraceDrawer(course) {
  const res = await apiFetch(`/api/orgs/${encodeURIComponent(state.selectedOrgId)}/courses/${encodeURIComponent(course.id)}/trace`);
  if (!res.ok) return toast(await errMsg(res), 'error');
  const data = await res.json();
  const close = () => bg.remove();
  const bg = el('div', { className:'drawer-bg', onClick:(e) => { if (e.target === bg) close(); } },
    el('div', { className:'drawer' },
      el('div', { style:'display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem' }, el('h2', { style:'margin:0' }, 'Access trace'), el('button', { className:'btn-secondary btn-sm', onClick:close }, 'Close')),
      el('h3', { style:'color:var(--primary)' }, course.title), el('div', { className:'mono muted', style:'margin-bottom:1rem' }, course.id),
      el('div', { style:'display:flex;gap:.5rem;margin-bottom:1.25rem' }, ...[['view','View'],['edit','Edit'],['delete','Delete']].map(([k, l]) => el('span', { className:`perm ${data.decision[k] ? 'yes' : 'no'}` }, l))),
      ...data.steps.map(s => el('div', { className:`step ${s.passed ? 'ok' : 'bad'}` },
        el('div', { style:'font-weight:600;text-transform:capitalize' }, (s.passed ? '✓ ' : '✗ ') + s.key.replace(/_/g, ' ')),
        el('div', { className:'muted', style:'font-size:.82rem;margin-top:.3rem' }, s.detail)))));
  document.body.appendChild(bg);
}

window.addEventListener('DOMContentLoaded', init);
</script>
