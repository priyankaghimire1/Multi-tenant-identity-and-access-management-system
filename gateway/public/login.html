<!doctype html>
<meta charset="utf-8"><title>PKCE login</title>
<button id="login">Log in with Keycloak</button>
<pre id="out"></pre>
<script>
const KC = 'http://localhost:8080/realms/multitenant/protocol/openid-connect';
const CLIENT = 'gateway-web', REDIRECT = location.origin + '/login.html';
const b64 = b => btoa(String.fromCharCode(...new Uint8Array(b)))
  .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

login.onclick = async () => {
  const verifier = b64(crypto.getRandomValues(new Uint8Array(32)));
  const challenge = b64(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  sessionStorage.setItem('v', verifier);
  location = KC + '/auth?' + new URLSearchParams({
    client_id: CLIENT, redirect_uri: REDIRECT, response_type: 'code', scope: 'openid',
    code_challenge: challenge, code_challenge_method: 'S256' });
};

const code = new URLSearchParams(location.search).get('code');
if (code) (async () => {
  const r = await fetch(KC + '/token', { method: 'POST', body: new URLSearchParams({
    grant_type: 'authorization_code', client_id: CLIENT, code,
    redirect_uri: REDIRECT, code_verifier: sessionStorage.getItem('v') }) });
  const t = await r.json();
  out.textContent = JSON.stringify(t.access_token
    ? await (await fetch('/me', { headers: { Authorization: 'Bearer ' + t.access_token } })).json()
    : t, null, 2);
})();
</script>
